[package]
name = "qaqh-app-notifications"
version.workspace = true
edition = "2024"
description = "Microsoft.Windows.AppNotifications (Windows App SDK) WinMD bindings + QAQ-Harness wrapper"

[dependencies]
windows-core = { path = "../../../qaqh-winui-reactor-vendor/crates/libs/core" }
windows-collections = { path = "../../../qaqh-winui-reactor-vendor/crates/libs/collections" }
windows-future = { path = "../../../qaqh-winui-reactor-vendor/crates/libs/future" }
windows-time = { path = "../../../qaqh-winui-reactor-vendor/crates/libs/time" }
windows = { path = "../../../qaqh-winui-reactor-vendor/crates/libs/windows", default-features = false, features = ["ro", "libloaderapi"] }

[build-dependencies]
windows-bindgen = { path = "../../../qaqh-winui-reactor-vendor/crates/libs/bindgen" }
