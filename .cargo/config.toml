# 本地开发配置（勿提交含个人路径的改动）
#
# qaqh-app-notifications/build.rs 缺省自动探测已安装的 Windows App Runtime
# （C:\Program Files\WindowsApps\Microsoft.WindowsAppRuntime.*\，本机已装
# 2.4.0，与 vendor pin 的 microsoft.windowsappsdk 2.4.0 一致）。
# 若机器未装运行时，可设置环境变量 QAQH_WINMD_DIR 指向含
# Microsoft.Windows.AppNotifications.winmd 的目录（如从 NuGet 包提取：
#   curl -sSL https://www.nuget.org/api/v2/package/microsoft.windowsappsdk/2.4.0 -o pkg.nupkg
#   tar -xf pkg.nupkg -C <tmp> && 拷贝 metadata/**/*.winmd 到某目录）。
