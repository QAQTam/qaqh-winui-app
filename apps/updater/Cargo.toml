[package]
name = "qaqh-updater"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "QAQ-Harness component update planner and executor"

[[bin]]
name = "qaqh-updater"
path = "src/main.rs"

[dependencies]
qaqh-update = { path = "../../../QAQ-Harness/crates/qaqh-update" }
qaqh-types = { path = "../../../QAQ-Harness/crates/qaqh-types" }
dirs = "6"
eframe = "0.29"
egui = "0.29"
serde_json = "1"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(windows)'.build-dependencies]
winres = "0.1"

[lints]
workspace = true
